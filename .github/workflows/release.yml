name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate tag
        run: node scripts/check-release-tag.ts "$TAG"
      - name: Forbidden files
        run: npm run check:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build installer
        env:
          # Empty until a code signing certificate exists (README, "Assinatura de código").
          WIN_SIGN_COMMAND: ${{ secrets.WIN_SIGN_COMMAND }}
          WIN_SIGN_USERNAME: ${{ secrets.WIN_SIGN_USERNAME }}
          WIN_SIGN_PASSWORD: ${{ secrets.WIN_SIGN_PASSWORD }}
          WIN_SIGN_CREDENTIAL_ID: ${{ secrets.WIN_SIGN_CREDENTIAL_ID }}
          WIN_SIGN_TOTP_SECRET: ${{ secrets.WIN_SIGN_TOTP_SECRET }}
        run: npm run dist
      - name: Signature
        shell: pwsh
        env:
          WIN_SIGN_COMMAND: ${{ secrets.WIN_SIGN_COMMAND }}
        run: |
          $exe = Get-ChildItem packages/app/dist/SoulSilver-Desktop-Setup-*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          if ($env:WIN_SIGN_COMMAND) {
            if ($sig.Status -ne 'Valid') { Write-Error "Instalador sem assinatura válida: $($sig.Status)"; exit 1 }
            Write-Host "Assinado por $($sig.SignerCertificate.Subject)"
          } else {
            Write-Host "::warning::Instalador sem assinatura de código: o SmartScreen vai avisar na instalação."
          }
      - name: Verify package
        run: node scripts/verify-package.ts packages/app/dist/win-unpacked
      - name: Release notes
        run: node scripts/release-notes.ts "$TAG" release-notes.md
      - name: Publish
        run: |
          version="${TAG#v}"
          dist=packages/app/dist
          gh release create "$TAG" \
            "$dist/SoulSilver-Desktop-Setup-$version.exe" \
            "$dist/SoulSilver-Desktop-Setup-$version.exe.blockmap" \
            "$dist/latest.yml" \
            --title "$TAG" \
            --notes-file release-notes.md
