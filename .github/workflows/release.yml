name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate tag
        run: node scripts/check-release-tag.ts "$TAG"
      - name: Forbidden files
        run: npm run check:assets
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build installer
        run: npm run dist
      - name: Verify package
        run: node scripts/verify-package.ts packages/app/dist/win-unpacked
      - name: Release notes
        run: node scripts/release-notes.ts "$TAG" release-notes.md
      - name: Publish
        run: |
          version="${TAG#v}"
          dist=packages/app/dist
          gh release create "$TAG" \
            "$dist/SoulSilver-Desktop-Setup-$version.exe" \
            "$dist/SoulSilver-Desktop-Setup-$version.exe.blockmap" \
            "$dist/latest.yml" \
            --title "$TAG" \
            --notes-file release-notes.md
