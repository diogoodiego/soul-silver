<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Áudio</title>
<style>
  :root { --bg: #14161a; --panel: #1d2026; --line: #2d323b; --text: #e6e8ec; --dim: #99a0ac; --accent: #6cb6ff; --loop: #f2b84b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; display: grid; grid-template-columns: 320px 1fr; height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 12px; display: grid; gap: 8px; border-bottom: 1px solid var(--line); }
  select, input[type=search], button { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; }
  button { cursor: pointer; }
  button:focus-visible, li:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  ul { list-style: none; margin: 0; padding: 0; overflow: auto; flex: 1; }
  li { padding: 5px 12px; cursor: pointer; font-family: ui-monospace, monospace; font-size: 12px; }
  li:hover { background: var(--line); }
  li.on { background: var(--accent); color: #000; }
  main { display: grid; grid-template-rows: auto 1fr; min-width: 0; }
  .bar { padding: 12px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); }
  .stage { padding: 16px; display: grid; gap: 12px; align-content: start; }
  canvas { width: 100%; height: 160px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .legend { color: var(--dim); }
  .legend b { color: var(--loop); font-weight: normal; }
  #msg { padding: 24px; color: var(--dim); }
  .dim { color: var(--dim); }
  @media (max-width: 700px) { body { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; } }
</style>
</head>
<body>
<aside>
  <header>
    <select id="kind" aria-label="Tipo">
      <option value="music">Músicas</option>
      <option value="jingle">Jingles</option>
      <option value="effect">Efeitos</option>
      <option value="cry">Cries</option>
    </select>
    <input id="filter" type="search" placeholder="Filtrar por id ou nome" aria-label="Filtrar por id ou nome">
  </header>
  <ul id="list" role="listbox" aria-label="Faixas"></ul>
</aside>
<main>
  <div class="bar">
    <button id="play" type="button">Tocar</button>
    <button id="stop" type="button">Parar</button>
    <label><input id="loop" type="checkbox" checked> repetir o loop</label>
    <span id="info" class="dim"></span>
  </div>
  <div class="stage">
    <canvas id="wave" width="1200" height="160" aria-label="Forma de onda da faixa, com o loop marcado"></canvas>
    <div class="legend">A introdução toca uma vez; o trecho entre as linhas <b>amarelas</b> é o loop, que se repete.</div>
    <div id="msg" hidden></div>
  </div>
</main>
<script>
"use strict";
// Dev-only audio player (specs/009-audio-extraction, research.md R8). Plays the WAVs of the audio
// stage (IMA ADPCM, decoded here as in shared/src/audio/adpcm.ts) and marks each track's loop.
const $ = (id) => document.getElementById(id);
const STEPS = [7,8,9,10,11,12,13,14,16,17,19,21,23,25,28,31,34,37,41,45,50,55,60,66,73,80,88,97,107,118,130,143,157,173,190,209,230,253,279,307,337,371,408,449,494,544,598,658,724,796,876,963,1060,1166,1282,1411,1552,1707,1878,2066,2272,2499,2749,3024,3327,3660,4026,4428,4871,5358,5894,6484,7132,7845,8630,9493,10442,11487,12635,13899,15289,16818,18500,20350,22385,24623,27086,29794,32767];
const INDEX = [-1, -1, -1, -1, 2, 4, 6, 8];
let index = null;
let current = null;
let ctx = null;
let source = null;
let startedAt = 0;
let raf = 0;

function decodeWav(buf) {
  const v = new DataView(buf);
  const tag = (o) => String.fromCharCode(v.getUint8(o), v.getUint8(o + 1), v.getUint8(o + 2), v.getUint8(o + 3));
  const chunks = {};
  for (let o = 12; o + 8 <= v.byteLength; ) { const s = v.getUint32(o + 4, true); chunks[tag(o)] = o + 8; o += 8 + s + (s & 1); }
  const f = chunks["fmt "];
  const count = v.getUint16(f + 2, true), rate = v.getUint32(f + 4, true), align = v.getUint16(f + 12, true);
  const per = ((align - 4 * count) * 2) / count + 1, samples = v.getUint32(chunks.fact, true);
  const out = Array.from({ length: count }, () => new Float32Array(samples));
  for (let b = 0, n0 = 0; n0 < samples; b++, n0 += per) {
    const base = chunks.data + b * align;
    for (let c = 0; c < count; c++) {
      let s = v.getInt16(base + c * 4, true), i = Math.min(88, v.getUint8(base + c * 4 + 2)), n = n0;
      out[c][n++] = s / 32768;
      for (let g = 0; n < samples && g < (per - 1) / 8; g++) {
        const at = base + 4 * count + (g * count + c) * 4;
        for (let k = 0; k < 8 && n < samples; k++) {
          const byte = v.getUint8(at + (k >> 1)), nib = k & 1 ? byte >> 4 : byte & 15, step = STEPS[i];
          let d = step >> 3;
          if (nib & 4) d += step; if (nib & 2) d += step >> 1; if (nib & 1) d += step >> 2;
          s = Math.max(-32768, Math.min(32767, nib & 8 ? s - d : s + d));
          i = Math.max(0, Math.min(88, i + INDEX[nib & 7]));
          out[c][n++] = s / 32768;
        }
      }
    }
  }
  return { rate, channels: out };
}

function entries() {
  const kind = $("kind").value;
  const items = kind === "cry"
    ? index.cries.map((c) => ({ key: c.file, label: `${String(c.species).padStart(3, "0")}${c.form ? "-" + c.form : ""}  banco ${c.bank}`, file: c.file, loop: null, samples: c.samples }))
    : index.tracks.filter((t) => t.kind === kind).map((t) => ({ key: t.file, label: `${t.id}  ${t.name}`, file: t.file, loop: t.loop, samples: t.samples }));
  const q = $("filter").value.trim().toLowerCase();
  return q ? items.filter((e) => e.label.toLowerCase().includes(q)) : items;
}

function renderList() {
  const list = $("list");
  list.replaceChildren(...entries().map((e) => {
    const li = document.createElement("li");
    li.textContent = e.label;
    li.tabIndex = 0;
    li.setAttribute("role", "option");
    li.onclick = () => select(e, li, true);
    li.onkeydown = (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); select(e, li, true); } };
    if (current && current.entry.key === e.key) li.classList.add("on");
    return li;
  }));
}

async function select(entry, li, play) {
  document.querySelectorAll("li.on").forEach((x) => x.classList.remove("on"));
  li.classList.add("on");
  stop();
  const buf = await (await fetch("/data/" + entry.file.split("/").map(encodeURIComponent).join("/"))).arrayBuffer();
  const wav = decodeWav(buf);
  ctx ??= new AudioContext();
  const audio = ctx.createBuffer(wav.channels.length, wav.channels[0].length, wav.rate);
  wav.channels.forEach((c, i) => audio.copyToChannel(c, i));
  current = { entry, audio, wav };
  const secs = (n) => (n / wav.rate).toFixed(2) + " s";
  $("info").textContent = `${secs(entry.samples)}, ${wav.channels.length === 2 ? "estéreo" : "mono"}` + (entry.loop ? `, loop de ${secs(entry.loop.start)} a ${secs(entry.loop.end)}` : ", sem loop");
  draw(0);
  if (play) start();
}

function start() {
  if (!current) return;
  stop();
  source = ctx.createBufferSource();
  source.buffer = current.audio;
  const loop = current.entry.loop;
  if (loop && $("loop").checked) {
    source.loop = true;
    source.loopStart = loop.start / current.wav.rate;
    source.loopEnd = loop.end / current.wav.rate;
  }
  source.connect(ctx.destination);
  source.onended = () => { cancelAnimationFrame(raf); draw(0); };
  source.start();
  startedAt = ctx.currentTime;
  const tick = () => {
    let t = (ctx.currentTime - startedAt) * current.wav.rate;
    if (loop && source && source.loop && t >= loop.end) t = loop.start + ((t - loop.start) % (loop.end - loop.start));
    draw(t);
    raf = requestAnimationFrame(tick);
  };
  tick();
}

function stop() {
  cancelAnimationFrame(raf);
  if (source) { source.onended = null; try { source.stop(); } catch {} source = null; }
}

function draw(cursor) {
  const cv = $("wave"), g = cv.getContext("2d"), w = cv.width, h = cv.height;
  g.clearRect(0, 0, w, h);
  if (!current) return;
  const data = current.wav.channels[0], per = Math.max(1, Math.floor(data.length / w));
  g.fillStyle = "#6cb6ff";
  for (let x = 0; x < w; x++) {
    let lo = 0, hi = 0;
    for (let i = x * per; i < Math.min(data.length, (x + 1) * per); i++) { lo = Math.min(lo, data[i]); hi = Math.max(hi, data[i]); }
    g.fillRect(x, h / 2 - hi * h / 2, 1, Math.max(1, (hi - lo) * h / 2));
  }
  const loop = current.entry.loop;
  if (loop) {
    g.fillStyle = "#f2b84b";
    for (const at of [loop.start, loop.end]) g.fillRect(Math.min(w - 2, Math.round(at / data.length * w)), 0, 2, h);
  }
  g.fillStyle = "#e6e8ec";
  g.fillRect(Math.round(cursor / data.length * w), 0, 1, h);
}

async function main() {
  const r = await fetch("/data/index.json");
  if (!r.ok) {
    $("msg").hidden = false;
    $("msg").textContent = "Nenhum áudio extraído. Rode a extração (npm run extract) antes de abrir esta página.";
    return;
  }
  index = await r.json();
  $("kind").onchange = renderList;
  $("filter").oninput = renderList;
  $("play").onclick = start;
  $("stop").onclick = () => { stop(); draw(0); };
  $("loop").onchange = () => { if (source) start(); };
  const wanted = decodeURIComponent(location.hash.slice(1));
  const track = wanted && index.tracks.find((t) => String(t.id) === wanted);
  if (track) $("kind").value = track.kind;
  renderList();
  if (track) {
    const li = [...$("list").children].find((x) => x.textContent.startsWith(String(track.id) + " "));
    if (li) select(entries().find((e) => e.key === track.file), li, false);
  }
}
main();
</script>
</body>
</html>
