<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visualizador de mapas</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f4f1; --fg: #1d1d1b; --muted: #6b6b66; --panel: #ffffff; --line: #d8d8d2; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161715; --fg: #ecece6; --muted: #9a9a92; --panel: #22231f; --line: #3a3b35; } }
    :root[data-theme="dark"] { --bg: #161715; --fg: #ecece6; --muted: #9a9a92; --panel: #22231f; --line: #3a3b35; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
    header, main { padding: 12px 16px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); background: var(--panel); }
    label { display: inline-flex; gap: 6px; align-items: center; }
    select, input[type="search"] { font: inherit; padding: 4px 6px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; }
    input[type="search"] { width: 16em; }
    #view { overflow: auto; border: 1px solid var(--line); background: var(--panel); }
    canvas { display: block; image-rendering: pixelated; }
    #legend { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; color: var(--muted); }
    .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.25); }
    #status { color: var(--muted); }
    @media (max-width: 600px) { header, main { padding: 10px; } input[type="search"] { width: 100%; } }
  </style>
</head>
<body>
  <header>
    <label>Mapa <select id="map"></select></label>
    <label>Buscar <input id="filter" type="search" placeholder="nome ou id"></label>
    <label>Nível <select id="level"></select></label>
    <label><input id="collision" type="checkbox"> Colisão</label>
    <label id="animateLabel" hidden><input id="animate" type="checkbox"> Animar</label>
    <label>Zoom <select id="zoom"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></label>
  </header>
  <main>
    <div id="status">Carregando…</div>
    <div id="legend"></div>
    <div id="view"></div>
  </main>
  <script type="importmap">{ "imports": { "three": "/three/three.module.js" } }</script>
  <script type="module">
    // Read-only viewer for the maps stage output: the map's 3D mesh (mesh.json, mesh.bin, textures/)
    // under the game's oblique camera, with the collision of a level on top. Data comes from /data/.
    import * as THREE from "three";

    const COLORS = {
      blocked: [220, 40, 40, 0.55],
      free: null,
      tallGrass: [40, 170, 60, 0.5],
      water: [40, 110, 230, 0.5],
      ledge: [240, 140, 20, 0.6],
      ladder: [150, 70, 210, 0.6],
      levelTransition: [250, 230, 40, 0.7],
      special: [230, 60, 200, 0.6],
    };
    const LABELS = {
      blocked: "bloqueado", free: "livre", tallGrass: "grama alta", water: "água",
      ledge: "ressalto", ladder: "escada", levelTransition: "transição de nível", special: "especial",
    };
    // Same as packages/client/src/render/camera.ts and map-scene.ts.
    const OBLIQUE = 0.75;
    const VERTEX_FLOATS = 8;
    // ANIMATION_FRAME_MS of shared/maps/constants.ts: a frame every 2 game frames at 30 per second.
    const FRAMES_PER_SECOND = 15;

    const el = (id) => document.getElementById(id);
    THREE.ColorManagement.enabled = false;
    const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
    renderer.outputColorSpace = THREE.LinearSRGBColorSpace;
    renderer.setPixelRatio(1);
    renderer.setClearColor(0x777777);
    el("view").append(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.Camera();
    camera.matrixAutoUpdate = false;
    const state = { names: {}, headers: [], mesh: null, map: null, overlay: null, collision: null, timer: null, view: null };

    function readStore(key) { try { return localStorage.getItem(key); } catch { return null; } }
    function writeStore(key, value) { try { localStorage.setItem(key, value); } catch { /* private window */ } }

    function mapLabel(header) {
      const name = state.names[header.mapsec];
      return `${String(header.id).padStart(4, "0")}${name ? " · " + name : ""} (${header.areaType})`;
    }

    function fillMapList() {
      const filter = el("filter").value.trim().toLowerCase();
      const select = el("map");
      const previous = select.value;
      select.replaceChildren(...state.headers
        .filter((h) => !filter || mapLabel(h).toLowerCase().includes(filter))
        .map((h) => new Option(mapLabel(h), String(h.id))));
      const saved = readStore("maps-viewer:map");
      const pick = [previous, saved].find((v) => v && [...select.options].some((o) => o.value === v));
      if (pick) select.value = pick;
    }

    async function loadJson(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return res.json();
    }

    async function loadBitmap(path) {
      const res = await fetch(path);
      if (!res.ok) throw new Error(`${path}: ${res.status}`);
      return createImageBitmap(await res.blob(), { premultiplyAlpha: "none", colorSpaceConversion: "none" });
    }

    function wrapping(repeat, flip) {
      if (!repeat) return THREE.ClampToEdgeWrapping;
      return flip ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping;
    }

    // The mesh as three.js objects, one per group (see map-scene.ts in the client).
    function buildMap(file, vertices, images) {
      const root = new THREE.Group();
      const buffer = new THREE.InterleavedBuffer(vertices, VERTEX_FLOATS);
      const animated = [];
      for (const group of file.groups) {
        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.InterleavedBufferAttribute(buffer, 3, 0));
        geometry.setAttribute("uv", new THREE.InterleavedBufferAttribute(buffer, 2, 3));
        geometry.setAttribute("color", new THREE.InterleavedBufferAttribute(buffer, 3, 5));
        geometry.setDrawRange(group.first, group.count);
        // One view per image, its scale and offset set by the frame shown (a cycle has hundreds of frames).
        const views = new Map();
        for (const f of group.frames) {
          if (views.has(f.texture)) continue;
          const t = new THREE.Texture(images[f.texture]);
          t.flipY = false;
          t.colorSpace = THREE.NoColorSpace;
          t.magFilter = t.minFilter = THREE.NearestFilter;
          t.generateMipmaps = false;
          t.wrapS = wrapping(group.repeat[0], group.flip[0]);
          t.wrapT = wrapping(group.repeat[1], group.flip[1]);
          t.needsUpdate = true;
          views.set(f.texture, t);
        }
        const frames = { length: group.frames.length, at: (k) => {
          const f = group.frames[k % group.frames.length];
          const t = views.get(f.texture);
          t.repeat.set(f.scale[0], f.scale[1]);
          t.offset.set(f.translate[0], f.translate[1]);
          return t;
        } };
        const material = new THREE.MeshBasicMaterial({
          map: frames.at(0), vertexColors: true, side: THREE.DoubleSide, transparent: group.translucent, opacity: group.alpha,
          depthWrite: !group.translucent, alphaTest: group.translucent ? 1 / 255 : 0.5,
        });
        if (frames.length > 1) animated.push({ material, frames });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.frustumCulled = false;
        root.add(mesh);
      }
      return { root, animated };
    }

    function disposeTree(object) {
      object.traverse((o) => {
        if (!o.isMesh) return;
        o.geometry.dispose();
        o.material.map?.dispose();
        o.material.dispose();
      });
    }

    // Whole map in view: ground grid plus room above the north edge for what rises over it.
    function frameView(file) {
      const highest = Math.max(0, ...file.ground.flat());
      const margin = Math.ceil(OBLIQUE * highest) + 96;
      const W = file.width * 16;
      const H = file.height * 16 + margin;
      const top = -margin;
      const R = 4096;
      const middle = OBLIQUE * (top + H / 2);
      camera.projectionMatrix.set(
        2 / W, 0, 0, -1,
        0, (2 * OBLIQUE) / H, -2 / H, (2 * top) / H + 1,
        0, -1 / R, -OBLIQUE / R, middle / R,
        0, 0, 0, 1,
      );
      camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
      state.view = { W, H };
    }

    function buildOverlay() {
      if (state.overlay) { scene.remove(state.overlay); disposeTree(state.overlay); state.overlay = null; }
      if (!el("collision").checked || !state.collision || !state.mesh) return;
      const { width: w, tiles } = state.collision;
      const level = Math.min(Number(el("level").value), state.mesh.ground.length - 1);
      const ground = state.mesh.ground[level];
      const positions = [];
      const colors = [];
      tiles.forEach((cell, i) => {
        const color = COLORS[cell.category];
        if (!color) return;
        const x = (i % w) * 16, z = Math.floor(i / w) * 16, y = ground[i] + 0.5;
        const quad = [[x, z], [x + 16, z], [x, z + 16], [x, z + 16], [x + 16, z], [x + 16, z + 16]];
        for (const [qx, qz] of quad) {
          positions.push(qx, y, qz);
          colors.push(color[0] / 255, color[1] / 255, color[2] / 255, color[3]);
        }
      });
      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 4));
      // Drawn over everything, so collision hidden behind a roof still shows.
      state.overlay = new THREE.Mesh(geometry, new THREE.MeshBasicMaterial({ vertexColors: true, transparent: true, depthTest: false, side: THREE.DoubleSide }));
      state.overlay.renderOrder = 1;
      state.overlay.frustumCulled = false;
      scene.add(state.overlay);
    }

    function draw() {
      if (!state.view) return;
      const zoom = Number(el("zoom").value);
      renderer.setSize(state.view.W, state.view.H, false);
      renderer.domElement.style.width = `${state.view.W * zoom}px`;
      renderer.domElement.style.height = `${state.view.H * zoom}px`;
      renderer.render(scene, camera);

      const legend = [];
      if (el("collision").checked && state.collision) {
        for (const [key, value] of Object.entries(COLORS)) {
          if (!value || !state.collision.tiles.some((c) => c.category === key)) continue;
          legend.push(`<span><span class="swatch" style="background: rgba(${value[0]}, ${value[1]}, ${value[2]}, ${value[3]})"></span>${LABELS[key]}</span>`);
        }
      }
      el("legend").innerHTML = legend.join("");
    }

    function setPlaying(on) {
      clearInterval(state.timer);
      state.timer = null;
      const animated = state.map?.animated ?? [];
      for (const a of animated) a.material.map = a.frames.at(0);
      if (on && animated.length > 0) {
        let k = 0;
        state.timer = setInterval(() => {
          k++;
          for (const a of animated) a.material.map = a.frames.at(k);
          draw();
        }, 1000 / FRAMES_PER_SECOND);
      }
      draw();
    }

    async function loadCollision() {
      const id = el("map").value;
      writeStore(`maps-viewer:level:${id}`, el("level").value);
      state.collision = await loadJson(`/data/${id.padStart(4, "0")}/collision/${el("level").value}.json`);
      buildOverlay();
      draw();
    }

    async function loadMap() {
      const id = el("map").value;
      if (!id) return;
      writeStore("maps-viewer:map", id);
      const dir = `/data/${id.padStart(4, "0")}`;
      const levels = [];
      for (let level = 0; level < 8; level++) {
        const res = await fetch(`${dir}/collision/${level}.json`, { method: "GET" });
        if (!res.ok) break;
        levels.push(level);
      }
      const current = Number(readStore(`maps-viewer:level:${id}`) ?? 0);
      el("level").replaceChildren(...levels.map((l) => new Option(`nível ${l}`, String(l))));
      el("level").value = String(levels.includes(current) ? current : levels[0]);
      el("status").textContent = "Carregando…";
      try {
        const file = await loadJson(`${dir}/mesh.json`);
        const res = await fetch(`${dir}/mesh.bin`);
        if (!res.ok) throw new Error(`mesh.bin: ${res.status}`);
        const vertices = new Float32Array(await res.arrayBuffer());
        const images = await Promise.all(Array.from({ length: file.textures }, (_, i) => loadBitmap(`${dir}/textures/${i}.png`)));
        if (el("map").value !== id) return;
        if (state.map) { scene.remove(state.map.root); disposeTree(state.map.root); }
        state.mesh = file;
        state.map = buildMap(file, vertices, images);
        scene.add(state.map.root);
        frameView(file);
        el("animateLabel").hidden = state.map.animated.length === 0;
        el("status").textContent = `${mapLabel(state.headers.find((h) => String(h.id) === id))} · ${file.width} × ${file.height} tiles`;
      } catch (error) {
        el("status").textContent = `Não foi possível carregar o mapa: ${error.message}`;
        return;
      }
      await loadCollision();
      setPlaying(el("animate").checked);
    }

    el("map").addEventListener("change", loadMap);
    el("level").addEventListener("change", loadCollision);
    el("filter").addEventListener("input", () => { fillMapList(); loadMap(); });
    el("collision").addEventListener("change", () => { buildOverlay(); draw(); });
    el("zoom").addEventListener("change", draw);
    el("animate").addEventListener("change", () => setPlaying(el("animate").checked));

    (async () => {
      try {
        const [headers, names] = await Promise.all([loadJson("/data/map-headers.json"), loadJson("/names.json")]);
        state.headers = headers.records;
        state.names = names;
        fillMapList();
        const fromHash = String(Number(location.hash.slice(1)));
        const first = state.headers.some((h) => String(h.id) === fromHash) ? fromHash : (el("map").value || String(state.headers[0]?.id ?? ""));
        el("map").value = first;
        await loadMap();
      } catch (error) {
        el("status").textContent = `Sem dados de mapas. Rode a etapa maps (npm run extract -- --stages maps). ${error.message}`;
      }
    })();
  </script>
</body>
</html>
