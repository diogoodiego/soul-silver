appId: io.github.soulsilver-desktop
productName: SoulSilver Desktop
directories:
  output: dist
  buildResources: build
# Everything runtime is bundled by electron-vite; never package anything else (principle II).
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: SoulSilver Desktop
  artifactName: SoulSilver-Desktop-Setup-${version}.${ext}
publish:
  provider: github
  owner: diogoodiego
  repo: soul-silver
